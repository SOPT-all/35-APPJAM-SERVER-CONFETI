# Workflow 이름
name: 101 DEV confeti-api 배포
run-name: confeti-api-develop-deploy-${{ github.ref_name }}-${{ github.run_number }} by @${{ github.actor }}

# Event Trigger 환경
on:
  workflow_dispatch:

permissions: # 워크플로우 권한
  id-token: write
  contents: read # 읽기

jobs:
  test:
    uses: ./.github/workflows/confeti-api-test.yml

  build:
    needs: test

    # 실행환경 설정
    runs-on: ubuntu-24.04

    # Action을 사용하여 Step을 구성
    steps:
      # GitHub repository 코드 체크아웃
      - name: checkout the repository
        uses: actions/checkout@v6

      # JDK 21 설치
      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 빌드를 위한 권한 부여
      - name: grant execute permission for gradlew
        run: chmod +x gradlew  # Gradle wrapper에 실행 권한 부여

      # Gradle을 사용하여 빌드 실행
      - name: build with gradle wrapper
        run: |
          ./gradlew clean build -x test

      # Docker 로그인
      - name: login docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 빌드 및 푸시
      - name: docker image build & push
        run: |
          docker build --platform linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    # 실행환경 설정
    runs-on: ubuntu-24.04
    environment: develop

    steps:
      # 원격 서버에 배포
      - name: develop deploy
        uses: appleboy/ssh-action@v1
        timeout-minutes: 30
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: '30m'
          script: |
            cd ~
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            cd confeti-api-server
            bash deploy.sh
