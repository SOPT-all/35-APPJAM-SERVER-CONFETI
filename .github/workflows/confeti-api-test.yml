name: testcase 실행
run-name: confeti-api-test-${{ github.ref_name }}-${{ github.run_number }} by @${{ github.actor }}

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, reopened, synchronize ]
  push:
    branches: [ "develop", "main" ]
  schedule:
    - cron: '0 3 * * 1-5'

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 21

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: configure timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Seoul"

      - name: execute testcase
        run: ./gradle clean test --parallel --build-cache --refresh-dependencies
