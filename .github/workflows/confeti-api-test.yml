name: 902 Test Case 실행
run-name: confeti-api-test-${{ github.ref_name }}-${{ github.run_number }} by @${{ github.actor }}

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches: [ "develop", "main" ]

permissions:
  contents: read
  issues: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: configure timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Seoul"

      - name: execute testcase
        run: ./gradlew clean test --parallel --build-cache --refresh-dependencies
