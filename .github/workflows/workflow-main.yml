# Workflow 이름
name: CD workflow
run-name: confeti-cd-prod-${{ github.ref_name }}-${{ github.run_number }} by @${{ github.actor }}

# Event Trigger 환경
on:
  push:
    branches: [ "develop" ]

permissions: # 워크플로우 권한
  id-token: write
  contents: read # 읽기

jobs:
  build:
    # 실행환경 설정
    runs-on: ubuntu-24.04

    # Action을 사용하여 Step을 구성
    steps:
      # GitHub repository 코드 체크아웃
      - name: Checkout the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 빌드 속도 향상을 위한 Gradle 캐싱
      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 빌드를 위한 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew  # Gradle wrapper에 실행 권한 부여

      # Gradle을 사용하여 빌드 실행
      - name: Build with Gradle Wrapper
        run: |
          ./gradlew clean build -x test

      # Docker 로그인
      - name: login docker hub
        uses: docker/login-action@v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 빌드 및 푸시
      - name: install docker buildx
        uses: docker/setup-buildx-action@v2.9.1

      - name: docker image build & push
        run: |
          docker build --platform linux/arm64 -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}

  deploy:
    needs: build
    # 실행환경 설정
    runs-on: ubuntu-24.04
    environment: production

    steps:
      # 원격 서버에 배포
      - name: docker container deploy
        uses: appleboy/ssh-action@master
        timeout-minutes: 30
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: '30m'
          script: |
            cd ~
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
            cd confeti-api-server
            bash deploy.sh
